<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline - IU3QEZ CW HST Keyer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #2c3e50;
            color: white;
            overflow: hidden;
        }

        .timeline-header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(44, 62, 80, 0.9);
            padding: 10px 20px;
            border-radius: 8px;
        }

        .timeline-title {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .timeline-controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .timeline-controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .timeline-controls input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .timeline-controls input[type="range"] {
            width: 120px;
        }

        .btn-back {
            padding: 8px 16px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .btn-back:hover {
            background-color: #2980b9;
        }

        #timeline-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #2c3e50;
        }

        .decoded-text {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(44, 62, 80, 0.95);
            padding: 20px;
            border-radius: 8px;
            z-index: 100;
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            letter-spacing: 0.1em;
            min-height: 80px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .decoded-text-label {
            font-size: 0.8rem;
            color: #95a5a6;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .decoded-text-content {
            color: #27ae60;
            font-weight: bold;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <canvas id="timeline-canvas"></canvas>

    <div class="decoded-text">
        <div class="decoded-text-label">Decoded Morse:</div>
        <div class="decoded-text-content" id="decoded-text-output">Waiting for input...</div>
    </div>

    <div class="timeline-header">
        <div class="timeline-title">IU3QEZ CW HST Keyer - Timeline</div>
        <div class="timeline-controls">
            <label>
                <input type="checkbox" id="timeline-enable" checked>
                Enable
            </label>
            <label>
                Duration: <span id="timeline-duration-value">3</span>s
                <input type="range" id="timeline-duration" min="1" max="10" value="3" step="1">
            </label>
            <a href="index.html" class="btn-back">← Config</a>
        </div>
    </div>

    <script src="timeline.js"></script>
    <script>
        // Initialize timeline renderer
        let timelineRenderer = null;

        document.addEventListener('DOMContentLoaded', function() {
            const enableCheckbox = document.getElementById('timeline-enable');
            const durationSlider = document.getElementById('timeline-duration');
            const durationValue = document.getElementById('timeline-duration-value');

            // Create timeline renderer
            timelineRenderer = new TimelineRenderer('timeline-canvas', {
                duration: parseInt(durationSlider.value) || 3,
                wpm: 20
            });

            // Enable/disable timeline
            enableCheckbox.addEventListener('change', function() {
                if (this.checked) {
                    timelineRenderer.start();
                } else {
                    timelineRenderer.stop();
                }
            });

            // Duration slider
            durationSlider.addEventListener('input', function() {
                durationValue.textContent = this.value;
                timelineRenderer.updateConfig({ duration: parseInt(this.value) });
            });

            // Start timeline if enabled
            if (enableCheckbox.checked) {
                timelineRenderer.start();
            }
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (timelineRenderer) {
                timelineRenderer.stop();
            }
        });
    </script>
</body>
</html>
