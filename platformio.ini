[env:esp32-s3-audioboard]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default.csv

monitor_speed = 115200
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:B5:4E:DB:1E:34-if00
monitor_filters = esp32_exception_decoder

upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:B5:4E:DB:1E:34-if00
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    fastled/FastLED@^3.7.0
