[env:esp32-s3-audioboard]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:B5:4E:DB:1E:34-if00
monitor_filters = esp32_exception_decoder

upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:B5:4E:DB:1E:34-if00
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -include lib/EspCompat/src/compat_ets_printf.h

platform_packages =
    framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.0.0
    framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.0.0/esp32-arduino-libs-3.0.0.zip

lib_deps =
    fastled/FastLED@^3.7.0
    esphome/ESPAsyncWebServer-esphome@^3.2.2
    bblanchon/ArduinoJson@^7.0.4
